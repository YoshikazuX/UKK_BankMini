<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title">
  <title>System workflow diagram for Bank Mini Sekolah</title>
  <defs>
    <style type="text/css"><![CDATA[
      .navy{fill:#1e293b}
      .teal{fill:#19C9A3}
      .stroke{stroke:#1e293b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    ]]></style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e293b" />
    </marker>
  </defs>
  <!-- Portal Web -->
  <rect x="300" y="20" width="200" height="60" class="navy" rx="8" />
  <text x="400" y="55" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Portal Web</text>
  <!-- Arrow to Backend -->
  <line x1="400" y1="80" x2="400" y2="130" class="stroke" marker-end="url(#arrow)" />
  <!-- Backend -->
  <rect x="250" y="130" width="300" height="80" class="navy" rx="8" />
  <text x="400" y="175" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Laravel Backend / API</text>
  <!-- Arrow to Database -->
  <line x1="400" y1="210" x2="400" y2="260" class="stroke" marker-end="url(#arrow)" />
  <!-- Database -->
  <rect x="300" y="260" width="200" height="60" class="navy" rx="8" />
  <text x="400" y="295" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">MySQL</text>
  <!-- Arrow up from Database to Backend -->
  <line x1="400" y1="320" x2="400" y2="380" class="stroke" marker-end="url(#arrow)" />
  <!-- Mobile App -->
  <rect x="20" y="340" width="200" height="100" class="navy" rx="8" />
  <text x="120" y="395" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Mobile App (Nasabah)</text>
  <!-- Arrow from Backend to Mobile -->
  <line x1="550" y1="210" x2="650" y2="210" class="stroke" marker-end="url(#arrow)" />
  <line x1="650" y1="210" x2="650" y2="390" class="stroke" marker-end="url(#arrow)" />
  <line x1="650" y1="390" x2="220" y2="390" class="stroke" marker-end="url(#arrow)" />
</svg>
