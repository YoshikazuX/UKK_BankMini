<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#f5f5f5"/>
  <!-- Header (teal) -->
  <rect y="0" width="800" height="60" fill="#19C9A3"/>
  <text x="400" y="38" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="white" text-anchor="middle">Dashboard Bank Mini</text>
  <!-- Sidebar -->
  <rect x="0" y="60" width="160" height="340" fill="#e2e8f0"/>
  <text x="80" y="100" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Menu</text>
  <line x1="20" y1="120" x2="140" y2="120" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="150" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Beranda</text>
  <text x="80" y="180" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Transaksi</text>
  <text x="80" y="210" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Laporan</text>
  <text x="80" y="240" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Pengguna</text>
  <!-- Main content area -->
  <g transform="translate(180,70)">
    <!-- Summary cards -->
    <rect x="0" y="0" width="200" height="80" fill="white" stroke="#cbd5e1"/> 
    <text x="100" y="30" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Total Nasabah</text>
    <text x="100" y="55" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#19C9A3" text-anchor="middle">1.200</text>
    <rect x="220" y="0" width="200" height="80" fill="white" stroke="#cbd5e1"/> 
    <text x="320" y="30" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Transaksi Hari Ini</text>
    <text x="320" y="55" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#19C9A3" text-anchor="middle">85</text>
    <rect x="440" y="0" width="200" height="80" fill="white" stroke="#cbd5e1"/> 
    <text x="540" y="30" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Saldo Total</text>
    <text x="540" y="55" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#19C9A3" text-anchor="middle">Rp 3.5 M</text>
    <!-- Operational chart (illustrative) -->
    <rect x="0" y="100" width="600" height="180" fill="white" stroke="#cbd5e1"/>
    <text x="300" y="130" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Statistik Operasional</text>
    <polyline points="50,250 150,190 250,210 350,160 450,180 550,140" fill="none" stroke="#19C9A3" stroke-width="4"/>
    <!-- Recent activity list -->
    <text x="10" y="300" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e293b">Aktivitas Terbaru</text>
    <text x="10" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#1e293b">- Setoran 150.000 (Siswa A)</text>
    <text x="10" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#1e293b">- Penarikan 75.000 (Siswa B)</text>
    <text x="10" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#1e293b">- Laporan diunggah (Admin)</text>
  </g>
</svg>
