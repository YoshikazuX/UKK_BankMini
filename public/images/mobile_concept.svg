<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400" viewBox="0 0 200 400" role="img" aria-labelledby="title">
  <title>Concept illustration of mobile app screen</title>
  <defs><style>.navy{fill:#1e293b}.teal{fill:#19C9A3}.stroke{stroke:#1e293b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <!-- Smartphone frame -->
  <rect x="20" y="20" width="160" height="360" rx="12" class="navy"/>
  <!-- Screen -->
  <rect x="30" y="40" width="140" height="320" class="teal"/>
  <!-- Simple UI elements -->
  <line x1="40" y1="80" x2="160" y2="80" class="stroke"/>
  <line x1="40" y1="120" x2="160" y2="120" class="stroke"/>
  <line x1="40" y1="160" x2="160" y2="160" class="stroke"/>
  <circle cx="100" cy="300" r="30" class="stroke"/>
</svg>

