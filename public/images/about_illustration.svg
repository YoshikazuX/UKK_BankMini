<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title">
  <title>Student savings illustration – book, piggy bank, and digital device</title>
  <defs>
    <style type="text/css"><![CDATA[
      .navy{fill:#1e293b}
      .teal{fill:#19C9A3}
      .stroke{stroke:#1e293b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    ]]></style>
  </defs>
  <!-- Savings book on the left -->
  <g class="stroke">
    <rect x="30" y="120" width="100" height="120" rx="6" ry="6" class="navy"/>
    <line x1="40" y1="150" x2="120" y2="150" class="teal"/>
    <line x1="40" y1="180" x2="120" y2="180" class="teal"/>
    <line x1="40" y1="210" x2="120" y2="210" class="teal"/>
  </g>
  <!-- Piggy bank in the centre -->
  <g transform="translate(170,150)" class="stroke">
    <path d="M0 0 a30 30 0 1 0 0.1 0" class="navy"/>
    <circle cx="10" cy="-10" r="5" class="teal"/>
    <path d="M-5 0 q15 -20 30 -20" class="teal" fill="none"/>
  </g>
  <!-- Tablet on the right representing digital management -->
  <g transform="translate(260,120)" class="stroke">
    <rect x="0" y="0" width="100" height="150" rx="8" ry="8" class="navy"/>
    <rect x="10" y="10" width="80" height="130" class="teal"/>
    <text x="50" y="85" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">App</text>
  </g>
</svg>
