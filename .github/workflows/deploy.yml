name: Deploy HANBANK to DomaiNesia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:
      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP PHP
      # ==========================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip
          coverage: none

      # ==========================================
      # 3. INSTALL COMPOSER DEPENDENCIES
      # ==========================================
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      # ==========================================
      # 4. LARAVEL OPTIMIZATION
      # ==========================================
      - name: Cache Laravel routes
        run: php artisan route:cache

      - name: Cache Laravel views
        run: php artisan view:cache

      # ==========================================
      # 5. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ==========================================
      # 6. INSTALL FRONTEND DEPENDENCIES
      # ==========================================
      - name: Install frontend dependencies
        run: npm ci

      # ==========================================
      # 7. BUILD FRONTEND
      # ==========================================
      - name: Build frontend assets
        run: npm run build

      # ==========================================
      # 8. PREPARE PRODUCTION VENDOR
      # ==========================================
      - name: Prepare production vendor directory
        run: |
          test -f vendor/autoload.php

          mv vendor vendor_release

          sed -i \
            's|hanbank_app/vendor/autoload.php|hanbank_app/vendor_release/autoload.php|' \
            public/index.php

          echo "Production vendor directory prepared."

      # ==========================================
      # 9. VERIFY DEPLOYMENT FILES
      # ==========================================
      - name: Verify deployment files
        run: |
          test -f vendor_release/autoload.php
          test -f public/index.php
          test -f bootstrap/app.php
          test -f public/build/manifest.json

          grep -q 'hanbank_app/vendor_release/autoload.php' public/index.php
          grep -q 'hanbank_app/bootstrap/app.php' public/index.php

          echo "All deployment files verified."

      # ==========================================
      # 10. DEPLOY LARAVEL APPLICATION
      # ==========================================
      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_APP_USERNAME }}
          password: ${{ secrets.FTP_APP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./
          server-dir: ./

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/public/**
            **/vendor/**
            **/tests/**
            **/.github/**
            **/phpunit.xml

      # ==========================================
      # 11. DEPLOY PUBLIC FILES
      # ==========================================
      - name: Deploy public files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_PUBLIC_USERNAME }}
          password: ${{ secrets.FTP_PUBLIC_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
