
name: Deploy HANBANK to DomaiNesia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip
          coverage: none

      
      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

     
      - name: Cache Laravel routes
        run: php artisan route:cache

      - name: Cache Laravel views
        run: php artisan view:cache

      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      
      - name: Install frontend dependencies
        run: npm ci

      
      - name: Build frontend assets
        run: npm run build

      
      - name: Prepare production vendor directory
        run: |
          mv vendor vendor_release
          sed -i 's|hanbank_app/vendor/autoload.php|hanbank_app/vendor_release/autoload.php|' public/index.php

      
      - name: Verify deployment files
        run: |
          test -f vendor_release/autoload.php
          test -f public/index.php
          grep -q 'vendor_release/autoload.php' public/index.php
          test -d public/build
          echo "Deployment files verified."

      
      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_APP_USERNAME }}
          password: ${{ secrets.FTP_APP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/public/**
            **/vendor/**
            **/vendor_release/.git*

      
      - name: Deploy public files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_PUBLIC_USERNAME }}
          password: ${{ secrets.FTP_PUBLIC_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
